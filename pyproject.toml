[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "comex"
version = "0.2.0"
description = "Plataforma de dados de comércio exterior: CDC, Kafka e lakehouse"
requires-python = ">=3.12"
dependencies = [
  "confluent-kafka>=2.5",
  "databricks-sdk>=0.36",
  "pandas>=2.2",
  "psycopg[binary]>=3.2",
  "pyarrow>=17",
  "pydantic-settings>=2.5",
  "requests>=2.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.6"]

[project.scripts]
comex = "comex.cli:main"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"lakehouse/**" = ["F821"]  # spark e dbutils são globais no runtime do Databricks
