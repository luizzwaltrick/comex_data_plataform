# Databricks Asset Bundle: deploy com `databricks bundle deploy -t dev`
bundle:
  name: comex_data_plataform

variables:
  catalogo:
    default: comex

resources:
  jobs:
    comex_medalhao:
      name: comex-medalhao
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: America/Sao_Paulo
      # Free Edition: só computação serverless (sem cluster próprio).
      tasks:
        - task_key: bronze
          notebook_task:
            notebook_path: ./src/01_bronze.py
            base_parameters: {catalogo: "${var.catalogo}"}
        - task_key: silver
          depends_on: [{task_key: bronze}]
          notebook_task:
            notebook_path: ./src/02_silver.py
            base_parameters: {catalogo: "${var.catalogo}"}
        - task_key: gold
          depends_on: [{task_key: silver}]
          notebook_task:
            notebook_path: ./src/03_gold.py
            base_parameters: {catalogo: "${var.catalogo}"}

targets:
  dev:
    mode: development
    default: true
